name: Isolated server balance guard tests

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-balance-guard:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tester
          POSTGRES_PASSWORD: tester
          POSTGRES_DB: guard_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tester -d guard_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://tester:tester@localhost:5432/guard_test_db
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL driver
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Run isolated database guard tests
        run: python -m unittest -v tests.server_balance_guard_test

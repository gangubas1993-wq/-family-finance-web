name: Validate and deploy Family Finance web

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate web client and inline JavaScript
        run: python scripts/validate_web.py

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published page
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import os
          import time
          import urllib.request

          url = os.environ["PAGE_URL"]
          expected = ['<html lang="ru">', 'Семейные финансы', 'Доступ участника', 'balanceWarning']
          last_error = None
          for attempt in range(8):
              try:
                  with urllib.request.urlopen(url, timeout=15) as response:
                      page = response.read().decode("utf-8")
                      if response.status != 200:
                          raise RuntimeError(f"HTTP {response.status}")
                  missing = [item for item in expected if item not in page]
                  if missing:
                      raise RuntimeError(f"published page is missing expected markers: {missing}")
                  print(f"PASS published page verified: {url}")
                  break
              except Exception as error:
                  last_error = error
                  if attempt < 7:
                      time.sleep(5)
          else:
              raise SystemExit(f"Published page verification failed: {last_error}")
          PY
